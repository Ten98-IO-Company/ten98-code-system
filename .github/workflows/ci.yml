name: Checks
on:
  push:
    paths-ignore: ["README.md", "AGENTS.md", "LICENSE"]
  pull_request:
    paths-ignore: ["README.md", "AGENTS.md", "LICENSE"]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify new release tag identity
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node check.mjs --release . --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_PATH"
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- index.mjs index.d.mts database-policy.mjs database-policy.d.mts
      - run: npm pack --dry-run
